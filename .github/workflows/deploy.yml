name: Deploy palmtrack-web to GitHub Pages

# Source lives in the private Kstriabintang/palmtrack-src repo — this repo only holds docs,
# screenshots and the deploy pipeline. `repository_dispatch` lets the private repo trigger a
# rebuild whenever it gets a new commit (see its own .github/workflows/notify-deploy.yml).
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [source-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: Kstriabintang/palmtrack-src
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          path: source

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: source/palmtrack-web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source/palmtrack-web
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: source/palmtrack-web
        env:
          VITE_BASE_PATH: /palmtrack/
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/palmtrack-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
