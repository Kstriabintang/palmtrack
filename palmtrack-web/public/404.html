<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>PalmTrack</title>
    <!--
      GitHub Pages serves this file for any unknown path (e.g. a direct visit
      or refresh on /peron). It rewrites the URL into a query string and
      redirects to the real index.html, which restores it on load.
      Pattern: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var pathSegmentsToKeep = 1 // keep "/palmtrack"
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
